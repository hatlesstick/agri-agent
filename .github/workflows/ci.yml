name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI_OFFLINE: "1"
  AI_MOCK: "1"
  OPEN_METEO_GEOCODING_URL: ${{ secrets.OPEN_METEO_GEOCODING_URL }}
  OPEN_METEO_FORECAST_URL: ${{ secrets.OPEN_METEO_FORECAST_URL }}
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: Lint, types, tests, evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm eval
      - name: OpenAPI contract is up to date
        run: pnpm openapi && git diff --exit-code apps/api/openapi.json
      - name: Database migrations match the schema
        run: pnpm --filter @agri/api db:verify
      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-results
          path: |
            apps/api/.evals/results/
            apps/web/.evals/results/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-turbo-${{ github.job }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  database:
    name: Postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agri
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agri_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agri -d agri_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://agri:ci-only-password@localhost:5432/agri_test
      TEST_DATABASE_URL: postgres://agri:ci-only-password@localhost:5432/agri_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@agri/api^...
      - name: Migrations apply and are idempotent
        run: |
          pnpm --filter @agri/api db:migrate
          pnpm --filter @agri/api db:migrate
      - name: Repository and schema tests on Postgres
        run: pnpm --filter @agri/api test:db

  docker:
    name: API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: agri-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  production-smoke:
    name: Production stack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts are clean
        run: shellcheck -x infra/deploy.sh infra/bootstrap.sh infra/smoke/*.sh
      - name: Caddy, API and Postgres from the production Compose file
        run: infra/smoke/run.sh
      - name: Deploy, failed migration, failed readiness and rollback
        run: SMOKE_SKIP_BUILD=1 infra/smoke/deploy-test.sh
      - name: Server bootstrap on a clean Ubuntu 24.04 container
        run: infra/smoke/bootstrap-test.sh
      - name: Workflows are valid
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -no-color

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
